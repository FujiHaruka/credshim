name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p credshim | sed 's/.*[#@]//')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2; exit 1; }
      - run: ./scripts/check-release-excludes-testing.sh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
      - name: package
        run: |
          bin=target/${{ matrix.target }}/release/credshim
          "$bin" --version
          version=$(cargo pkgid -p credshim | sed 's/.*[#@]//')
          mkdir dist
          tar -czf "dist/credshim-$version-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" credshim
      - uses: actions/upload-artifact@v4
        with:
          name: credshim-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
