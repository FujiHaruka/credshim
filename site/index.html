<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CredShim</title>
<script>
  location.replace(navigator.languages?.some((l) => l.startsWith("ja")) ? "ja/" : "en/");
</script>
</head>
<body>
<p><a href="en/">English</a> · <a href="ja/" lang="ja">日本語</a></p>
</body>
</html>
